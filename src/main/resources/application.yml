spring:
  application:
    name: event-recommender
  elasticsearch:
    uris: ${ELASTICSEARCH_URI:http://localhost:9200}
    username: ${ELASTICSEARCH_USERNAME:}
    password: ${ELASTICSEARCH_PASSWORD:}
  data:
    elasticsearch:
      repositories:
        enabled: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,metrics
  endpoint:
    health:
      show-details: always
      # Add `elasticsearch` to the readiness probe so orchestrators (Compose,
      # Kubernetes) only consider the pod ready when the search backend is
      # reachable. Liveness intentionally excludes external dependencies.
      group:
        readiness:
          include: "readinessState,elasticsearch"
          show-details: always
          show-components: always
  prometheus:
    metrics:
      export:
        enabled: true
  otlp:
    metrics:
      export:
        enabled: ${OTLP_METRICS_ENABLED:false}
    tracing:
      export:
        endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  tracing:
    export:
      otlp:
        enabled: ${OTLP_TRACING_ENABLED:false}

logging:
  level:
    com.eventrecommender: INFO
    org.springframework.data.elasticsearch: WARN
